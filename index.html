<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosk Presensi (Siswa & Guru)</title>
  
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/qr-code.png">
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <!-- SCRIPT UNTUK MENGAKTIFKAN OFFLINE MODE (SERVICE WORKER) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker Terdaftar!'))
          .catch(err => console.log('Service Worker Gagal:', err));
      });
    }
  </script>

  <style>
    body { background-color: #0f141e; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #2ecc71; margin-bottom: 5px; font-size: 24px; font-weight: bold;}
    .subtitle { color: #8b9bb4; font-size: 14px; margin-bottom: 15px; }
    
    #offline-badge { background-color: #e74c3c; color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; margin: 0 auto 15px auto; width: fit-content; animation: pulse 2s infinite; }
    #sync-btn { background-color: #f39c12; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; display: none; margin: 10px auto; width: 100%; max-width: 400px; transition: background-color 0.3s ease;}
    
    #reader-container { background-color: #000000; border-radius: 12px; padding: 5px; margin: 0 auto; max-width: 400px; position: relative; }
    #reader { width: 100%; min-height: 300px; border-radius: 8px; overflow: hidden; border: 2px solid #2ecc71; }
    #reader video { object-fit: cover !important; }
    
    .btn-kamera { background-color: #2980b9; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
    .btn-kamera:active { background-color: #1f6391; transform: translateY(2px); }
    
    .footer-status { color: #5c6b82; font-size: 12px; margin-top: 20px; line-height: 1.8; }

    /* ========================================= */
    /* ANIMASI FEEDBACK LAYAR PENUH */
    /* ========================================= */
    #fullscreen-alert {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
        color: white; padding: 20px; box-sizing: border-box; text-align: center;
        animation: popIn 0.2s ease-out;
    }
    .alert-icon { font-size: 85px; margin-bottom: 15px; }
    .alert-title { font-size: 28px; font-weight: bold; margin: 0 0 10px 0; text-transform: uppercase; line-height:1.2;}
    .alert-desc { font-size: 16px; opacity: 0.9; line-height: 1.5; }
    
    .bg-green { background-color: #27ae60; }
    .bg-red { background-color: #c0392b; }
    .bg-blue { background-color: #2980b9; }

    .spinner { border: 6px solid rgba(255,255,255,0.3); border-top: 6px solid #ffffff; border-radius: 50%; width: 70px; height: 70px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .animate-pulse-icon { animation: pulse 1s infinite; }
  </style>
</head>
<body>
  <h1>SCAN PRESENSI</h1>
  <p class="subtitle">MAN 2 TIDORE KEPULAUAN</p>

  <div id="offline-badge">Koneksi Terputus - Mode Offline</div>
  <button id="sync-btn" onclick="syncData()">🔄 Sinkronisasi Data Tertunda (<span id="queue-count">0</span>)</button>
  
  <div id="reader-container">
    <div id="reader"></div>
  </div>
  
  <button class="btn-kamera" onclick="gantiKamera()">🔄 Ganti Kamera</button>

  <div class="footer-status">
    <span id="cam-status">Kamera: Menyiapkan...</span><br>
    <span id="db-status">Sistem Siap Digunakan.</span><br>
    <span id="gps-status">GPS: Memeriksa Lokasi...</span>
  </div>

  <!-- LAYAR PENUH UNTUK FEEDBACK SCANNER -->
  <div id="fullscreen-alert">
    <div class="alert-icon animate-pulse-icon" id="alert-icon">✅</div>
    <h2 class="alert-title" id="alert-title">BERHASIL</h2>
    <p class="alert-desc" id="alert-desc">Pesan sukses disini</p>
  </div>

  <script>
    // --- KONFIGURASI DATABASE & AUDIO ---
    const urlServer = "https://script.google.com/macros/s/AKfycbwBAOqB_Fif8pT1pYLhy_bA_JKEFotH2BsqzYvA5MzsKweD8XetcoeoIfMPkMgL1HAcyQ/exec"; 
    
    const beepSound = new Audio("https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3");
    
    let html5QrcodeScanner;
    let userLat = ""; let userLng = "";
    let modeKamera = "user"; 
    
    let isScanning = false;
    let isSyncing = false; 
    
    // --- MEMORI OFFLINE & COOLDOWN 15 MENIT ---
    let scanQueue = JSON.parse(localStorage.getItem('absenQueueSmart')) || [];
    let recentScans = JSON.parse(localStorage.getItem('recentScansKiosk')) || {};

    // --- PEMBUKA KUNCI SUARA BROWSER ---
    function unlockAudio() {
        beepSound.play().then(() => { 
            beepSound.pause(); 
            beepSound.currentTime = 0; 
        }).catch(() => {});
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('click', unlockAudio);
    }
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click', unlockAudio, { once: true });
    
    function updateQueueUI() {
      // Jangan timpa UI jika sedang dalam proses sinkronisasi
      if (isSyncing) return;

      const btn = document.getElementById('sync-btn');
      const badge = document.getElementById('offline-badge');
      const count = document.getElementById('queue-count');
      
      if (count) count.innerText = scanQueue.length;
      
      if (!navigator.onLine) {
        badge.style.display = 'block';
        badge.innerText = "Tidak Ada Internet - Tetap Scan Kartu";
        
        if (scanQueue.length > 0) {
            btn.style.display = 'block';
            btn.style.backgroundColor = "#f39c12"; // Oranye/Kuning
            btn.innerText = `🔄 Sinkronisasi Data Tertunda (${scanQueue.length})`;
            btn.disabled = false;
        } else {
            btn.style.display = 'none';
        }
      } else {
        badge.style.display = 'none';
        
        if (scanQueue.length > 0) {
            btn.style.display = 'block';
            btn.style.backgroundColor = "#f39c12"; 
            btn.innerText = `🔄 Sinkronisasi Data Tertunda (${scanQueue.length})`;
            btn.disabled = false;
        } else {
            // Tahan tombol agar tetap tampil dengan blok hijau jika isinya "Silahkan Lakukan Scan"
            if (btn.innerText === "Silahkan Lakukan Scan") {
                btn.style.display = 'block';
                btn.style.backgroundColor = "#27ae60"; // Blok Hijau
                btn.disabled = true; // Nonaktifkan klik karena antrean kosong
            } else {
                btn.style.display = 'none';
            }
        }
      }
    }

    window.addEventListener('online', () => {
        updateQueueUI();
        if (scanQueue.length > 0) syncData();
    });
    window.addEventListener('offline', updateQueueUI);

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          userLat = p.coords.latitude; userLng = p.coords.longitude;
          document.getElementById('gps-status').innerText = "GPS: " + userLat.toFixed(5) + ", " + userLng.toFixed(5);
          document.getElementById('gps-status').style.color = "#2ecc71";
        }, e => { 
          document.getElementById('gps-status').innerText = "GPS: Izin Ditolak"; 
          document.getElementById('gps-status').style.color = "#ff6b6b";
        }, { enableHighAccuracy: true });
      }
    }

    // ==========================================
    // FUNGSI ANIMASI LAYAR PENUH 
    // ==========================================
    function tampilkanSuksesLayarPenuh(judul, pesanHTML) {
        const alertBox = document.getElementById('fullscreen-alert');
        alertBox.className = "bg-green";
        alertBox.style.display = "flex";
        document.getElementById('alert-icon').innerHTML = "✅";
        document.getElementById('alert-icon').className = "alert-icon animate-pulse-icon";
        document.getElementById('alert-title').innerHTML = judul;
        document.getElementById('alert-desc').innerHTML = pesanHTML;
        
        setTimeout(() => {
            alertBox.style.display = "none";
            isScanning = false; 
        }, 2500); 
    }

    function tampilkanErrorLayarPenuh(pesanHTML) {
        const alertBox = document.getElementById('fullscreen-alert');
        alertBox.className = "bg-red";
        alertBox.style.display = "flex";
        document.getElementById('alert-icon').innerHTML = "❌";
        document.getElementById('alert-icon').className = "alert-icon";
        document.getElementById('alert-title').innerHTML = "PERHATIAN!";
        document.getElementById('alert-desc').innerHTML = pesanHTML;
        
        setTimeout(() => {
            alertBox.style.display = "none";
            isScanning = false;
        }, 3500); 
    }

    function tampilkanLoadingLayarPenuh() {
        const alertBox = document.getElementById('fullscreen-alert');
        alertBox.className = "bg-blue";
        alertBox.style.display = "flex";
        document.getElementById('alert-icon').innerHTML = `<div class="spinner"></div>`;
        document.getElementById('alert-icon').className = "";
        document.getElementById('alert-title').innerHTML = "MEMPROSES DATA...";
        document.getElementById('alert-desc').innerHTML = "Koneksi ke server. Jangan jauhkan kartu.";
    }

    // ==========================================
    // FUNGSI SUARA & GETARAN
    // ==========================================
    function playBeep() {
        let playPromise = beepSound.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.frequency.value = 1000; 
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            });
        }
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        
        const readerEl = document.getElementById('reader');
        if(readerEl) {
            readerEl.style.transition = "all 0.1s ease-in-out";
            readerEl.style.border = "12px solid #2ecc71";
            readerEl.style.boxShadow = "0px 0px 40px rgba(46, 204, 113, 0.9)";
            setTimeout(() => { 
                readerEl.style.border = "2px solid #2ecc71"; 
                readerEl.style.boxShadow = "none";
            }, 500);
        }
    }

    // ==========================================
    // PROSES SAAT KARTU DI-SCAN
    // ==========================================
    function onScanSuccess(decodedText) {
      if(isScanning || isSyncing) return; 
      isScanning = true;
      playBeep();

      let cleanId = decodedText.trim();
      let ekstrak = cleanId.match(/(?:NISN|NIP|ID)\s*[:=\-]?\s*(\d+)/i);
      if (ekstrak && ekstrak[1]) cleanId = ekstrak[1];
      else {
          let cariAngka = cleanId.match(/\d{9,18}/);
          if (cariAngka) cleanId = cariAngka[0];
      }
      cleanId = cleanId.replace(/\s+/g, '');

      const now = new Date();
      if (recentScans[cleanId]) {
          const lastScan = new Date(recentScans[cleanId]);
          const diffMs = now.getTime() - lastScan.getTime();
          const diffMins = diffMs / 1000 / 60;
          
          if (diffMins < 15) {
              const sisaWaktu = Math.ceil(15 - diffMins);
              tampilkanErrorLayarPenuh(`Anda Baru Saja Melakukan Scan.<br><br><span style='font-size:13px; opacity:0.8;'>Sistem menolak scan ganda untuk mencegah data dobel.<br>Silakan tunggu ${sisaWaktu} menit lagi jika ingin scan ulang.</span>`);
              return; 
          }
      }

      recentScans[cleanId] = now.getTime();
      localStorage.setItem('recentScansKiosk', JSON.stringify(recentScans));

      const jamScanClient = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0') + ":" + 
                            now.getSeconds().toString().padStart(2, '0');

      const dataScan = {
          id: cleanId,
          lat: userLat,
          lng: userLng,
          waktu_scan: jamScanClient
      };

      if (!navigator.onLine) {
         simpanKeAntrean(dataScan);
         tampilkanSuksesLayarPenuh("TERSIMPAN OFFLINE", `QR Code terbaca pukul ${jamScanClient}.<br>Data akan dikirim saat sinyal internet pulih.`);
      } else {
         kirimKeServer(dataScan);
      }
    }

    function simpanKeAntrean(data) {
      scanQueue.push(data);
      localStorage.setItem('absenQueueSmart', JSON.stringify(scanQueue));
      
      // Jika baru saja men-scan saat tombol hijau "Silahkan Lakukan Scan" muncul,
      // Kembalikan tombol ke mode sinkronisasi warna orange
      const btn = document.getElementById('sync-btn');
      if(btn.innerText === "Silahkan Lakukan Scan") {
          btn.innerText = "";
      }
      
      updateQueueUI();
    }

    function kirimKeServer(dataScan) {
        tampilkanLoadingLayarPenuh();
        
        const params = new URLSearchParams();
        params.append("id", dataScan.id);
        params.append("lat", dataScan.lat);
        params.append("lng", dataScan.lng);
        params.append("waktu_scan", dataScan.waktu_scan);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        fetch(urlServer, { method: "POST", body: params, signal: controller.signal })
        .then(res => res.text())
        .then(pesanFinal => {
            clearTimeout(timeoutId); 
            if (pesanFinal.includes("Berhasil") || pesanFinal.includes("Hadir") || pesanFinal.includes("Tepat") || pesanFinal.includes("Pulang") || pesanFinal.includes("Cepat") || pesanFinal.includes("Terlambat")) {
               tampilkanSuksesLayarPenuh("BERHASIL!", pesanFinal);
            } else {
               tampilkanErrorLayarPenuh(pesanFinal);
               delete recentScans[dataScan.id]; 
               localStorage.setItem('recentScansKiosk', JSON.stringify(recentScans));
            }
        })
        .catch(err => {
            clearTimeout(timeoutId);
            simpanKeAntrean(dataScan);
            if (err.name === 'AbortError') {
                tampilkanSuksesLayarPenuh("TERSIMPAN OFFLINE", "Server terlalu lama merespon.<br>Data berhasil diamankan di antrean HP.");
            } else {
                tampilkanSuksesLayarPenuh("TERSIMPAN OFFLINE", "Internet terputus saat memproses.<br>Data berhasil diamankan di antrean HP.");
            }
        })
        .finally(() => {
            setTimeout(() => { 
                isScanning = false; 
                const alertBox = document.getElementById('fullscreen-alert');
                if(alertBox.style.display === "flex" && alertBox.className === "bg-blue") {
                    alertBox.style.display = "none";
                }
            }, 3000);
        });
    }

    // ==========================================
    // FUNGSI SINKRONISASI 
    // ==========================================
    async function syncData() {
        if (scanQueue.length === 0 || !navigator.onLine || isSyncing) return;
        
        isSyncing = true; 
        isScanning = true; // Kunci Scanner agar tidak tembus
        
        const btn = document.getElementById('sync-btn');
        const totalData = scanQueue.length;
        
        btn.disabled = true;
        btn.style.display = "block";
        btn.style.backgroundColor = "#e67e22"; // Blok Oranye saat memproses

        let sisaAntrean = [];

        for (let i = 0; i < totalData; i++) {
            btn.innerText = `Sedang Sinkron Data.... ${i + 1} dari ${totalData} data sudah terkirim. Harap Tunggu`;

            let dataScan = scanQueue[i];
            const params = new URLSearchParams();
            params.append("id", dataScan.id);
            params.append("lat", dataScan.lat);
            params.append("lng", dataScan.lng);
            params.append("waktu_scan", dataScan.waktu_scan);

            try {
                await fetch(urlServer, { method: "POST", body: params });
            } catch (error) {
                sisaAntrean.push(dataScan); 
            }
        }

        scanQueue = sisaAntrean;
        localStorage.setItem('absenQueueSmart', JSON.stringify(scanQueue));
        
        if (scanQueue.length === 0) {
            // BERHASIL SEMUA
            btn.style.backgroundColor = "#27ae60"; // Blok Hijau
            btn.innerText = `Sukses Sinkron Data.... ${totalData} dari ${totalData} data sudah terkirim.`;
            
            // Tunggu 4 detik, lalu ganti teks menjadi "Silahkan Lakukan Scan"
            setTimeout(() => {
                btn.style.backgroundColor = "#27ae60"; // Pastikan Tetap Hijau
                btn.innerText = "Silahkan Lakukan Scan";
                
                isSyncing = false; 
                isScanning = false; // Buka kunci scanner
                
                updateQueueUI(); // Fungsi update UI mempertahankan blok hijau
            }, 4000);
            
        } else {
            // GAGAL SEBAGIAN/SEMUA
            btn.style.backgroundColor = "#c0392b"; // Blok Merah
            btn.innerText = `Gagal! Sisa ${scanQueue.length} data tertunda.`;
            
            setTimeout(() => {
                isSyncing = false; 
                isScanning = false; 
                btn.disabled = false;
                btn.style.backgroundColor = "#f39c12"; // Kembalikan ke warna asli kuning
                updateQueueUI(); 
            }, 4000);
        }
    }

    function mulaiKamera() {
      html5QrcodeScanner.start(
        { facingMode: modeKamera }, 
        { 
            fps: 15, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
                let boxSize = Math.floor(minEdgeSize * 0.95); 
                return { width: boxSize, height: boxSize };
            }, 
            aspectRatio: 1.0 
        }, 
        onScanSuccess
      ).then(() => {
        document.getElementById('cam-status').innerText = "Kamera: Aktif (" + (modeKamera === "user" ? "Depan" : "Belakang") + ")";
      }).catch(err => {
        document.getElementById('cam-status').innerText = "Gagal akses kamera: " + err;
      });
    }

    function gantiKamera() {
      if (!isScanning) {
          html5QrcodeScanner.stop().then(() => {
            modeKamera = (modeKamera === "environment") ? "user" : "environment";
            setTimeout(() => { mulaiKamera(); }, 300);
          }).catch(err => console.log(err));
      }
    }

    window.onload = function() {
      updateQueueUI();
      getLocation();
      html5QrcodeScanner = new Html5Qrcode("reader");
      mulaiKamera();
    };
  </script>
</body>
</html>
