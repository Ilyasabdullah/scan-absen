<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosk Presensi (Siswa & Guru)</title>
  
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/qr-code.png">
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <!-- SCRIPT UNTUK MENGAKTIFKAN OFFLINE MODE (SERVICE WORKER) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker Terdaftar!'))
          .catch(err => console.log('Service Worker Gagal:', err));
      });
    }
  </script>

  <style>
    body { background-color: #0f141e; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #2ecc71; margin-bottom: 5px; font-size: 24px; }
    .subtitle { color: #8b9bb4; font-size: 14px; margin-bottom: 15px; }
    
    #offline-badge { background-color: #e74c3c; color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; margin: 0 auto 15px auto; width: fit-content; animation: pulse 2s infinite; }
    #sync-btn { background-color: #f39c12; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; margin: 10px auto; width: 100%; max-width: 400px;}
    
    #reader-container { background-color: #000000; border-radius: 12px; padding: 5px; margin: 0 auto; max-width: 400px; position: relative; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #2ecc71; }
    
    #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10; border-radius: 12px; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { border: 5px solid #3a4556; border-top: 5px solid #2ecc71; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    
    .loading-text { color: #2ecc71; font-weight: bold; font-size: 16px; }
    #error-box { background-color: #1e2532; color: #ff6b6b; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 400px; display: none; font-size: 14px; border: 1px solid #3a4556; }
    #success-box { background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 400px; display: none; font-weight: bold; }
    
    .btn-kamera { background-color: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
    .btn-kamera:active { background-color: #1f6391; transform: translateY(2px); }
    
    .footer-status { color: #5c6b82; font-size: 12px; margin-top: 20px; line-height: 1.8; }
  </style>
</head>
<body>
  <h1>SCAN PRESENSI</h1>
  <p class="subtitle">TERINTEGRASI GURU & SISWA</p>

  <!-- Indikator Offline & Tombol Sinkronisasi -->
  <div id="offline-badge">Koneksi Terputus - Mode Offline</div>
  <button id="sync-btn" onclick="syncData()">🔄 Sinkronisasi Data Tertunda (<span id="queue-count">0</span>)</button>
  
  <div id="reader-container">
    <div id="reader"></div>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-msg">Memproses...</div>
    </div>
  </div>
  
  <button class="btn-kamera" onclick="gantiKamera()">🔄 Ganti Kamera</button>

  <div id="error-box"></div>
  <div id="success-box"></div>
  <div class="footer-status">
    <span id="cam-status">Kamera: Menyiapkan...</span><br>
    <span id="db-status">Menunggu Scan...</span><br>
    <span id="gps-status">GPS: Memeriksa Lokasi...</span>
  </div>

  <script>
    // --- KONFIGURASI DATABASE ---
    const urlGuru = "https://script.google.com/macros/s/AKfycbwBAOqB_Fif8pT1pYLhy_bA_JKEFotH2BsqzYvA5MzsKweD8XetcoeoIfMPkMgL1HAcyQ/exec"; 
    const urlSiswa = "https://script.google.com/macros/s/AKfycbwziHxR64ZaOmMT6K1gmnt4kwnTrXPrbKkB2QHgLLu_b3p0vYi2Cz3Ss_yq4cQYoeNFCg/exec";
 
    let html5QrcodeScanner;
    let userLat = ""; let userLng = "";
    let modeKamera = "user"; // "user" = Kamera depan (cocok untuk Kiosk), "environment" = Kamera belakang
    
    // PERBAIKAN: Pisahkan sistem lock scan dan lock sinkronisasi agar tidak bentrok
    let isScanning = false;
    let isSyncing = false; 
    
    let scanQueue = JSON.parse(localStorage.getItem('absenQueueSmart')) || [];
    
    function updateQueueUI() {
      const btn = document.getElementById('sync-btn');
      const badge = document.getElementById('offline-badge');
      const count = document.getElementById('queue-count');
      
      count.innerText = scanQueue.length;
      
      if (!navigator.onLine) {
        badge.style.display = 'block';
        badge.innerText = "Tidak Ada Internet - Data Masuk Antrean HP";
        btn.style.display = scanQueue.length > 0 ? 'block' : 'none';
      } else {
        badge.style.display = 'none';
        btn.style.display = scanQueue.length > 0 ? 'block' : 'none';
      }
    }

    // Auto-sync HANYA saat event 'online' terpancing (dari putus ke nyambung)
    window.addEventListener('online', () => {
        updateQueueUI();
        if (scanQueue.length > 0) syncData();
    });
    window.addEventListener('offline', updateQueueUI);

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          userLat = p.coords.latitude; userLng = p.coords.longitude;
          document.getElementById('gps-status').innerText = "GPS: " + userLat.toFixed(5) + ", " + userLng.toFixed(5);
          document.getElementById('gps-status').style.color = "#2ecc71";
        }, e => { 
          document.getElementById('gps-status').innerText = "GPS: Izin Ditolak"; 
          document.getElementById('gps-status').style.color = "#ff6b6b";
        }, { enableHighAccuracy: true });
      }
    }
    // --- FUNGSI FEEDBACK 100% OFFLINE ---
    function playBeep() {
        // 1. Bunyi Beep Sistem (Tanpa File Internet)
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = 800; // Frekuensi suara (semakin besar semakin nyaring)
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1);
            osc.stop(ctx.currentTime + 0.1);
        } catch (e) {}

        // 2. Getaran HP (200 milidetik)
        if (navigator.vibrate) {
            navigator.vibrate(200);
        }

        // 3. Kedipan Layar Hijau
        const originalBg = document.body.style.backgroundColor;
        document.body.style.backgroundColor = "#2ecc71"; 
        setTimeout(() => { document.body.style.backgroundColor = originalBg; }, 150);
    }

    // --- PROSES SAAT KARTU DI-SCAN ---
    function onScanSuccess(decodedText) {
      // PERBAIKAN: Jika sedang memproses data atau sedang sinkronisasi, abaikan scan baru
      if(isScanning || isSyncing) return; 
      
      isScanning = true;
      playBeep(); // <--- INI PERUBAHANNYA
    
      
      // Pembersihan String ID (Smart Detection)
      let cleanId = decodedText.trim();
      let ekstrak = cleanId.match(/(?:NISN|NIP|ID)\s*[:=\-]?\s*(\d+)/i);
      if (ekstrak && ekstrak[1]) cleanId = ekstrak[1];
      else {
          let cariAngka = cleanId.match(/\d{9,18}/);
          if (cariAngka) cleanId = cariAngka[0];
      }
      cleanId = cleanId.replace(/\s+/g, '');

      // Tangkap Waktu Aktual dari HP
      const now = new Date();
      const jamScanClient = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0') + ":" + 
                            now.getSeconds().toString().padStart(2, '0');

      const dataScan = {
          id: cleanId,
          lat: userLat,
          lng: userLng,
          waktu_scan: jamScanClient
      };

      if (!navigator.onLine) {
         simpanKeAntrean(dataScan);
         tampilkanPesan(document.getElementById('success-box'), "Tersimpan Offline (" + jamScanClient + ")");
      } else {
         kirimKeServer(dataScan);
      }
    }

    function simpanKeAntrean(data) {
      scanQueue.push(data);
      localStorage.setItem('absenQueueSmart', JSON.stringify(scanQueue));
      updateQueueUI();
    }

    function kirimKeServer(dataScan) {
      const loadingMsg = document.getElementById('loading-msg');
      const dbStatus = document.getElementById('db-status');
      
      document.getElementById('loading-overlay').style.display = 'flex';
      loadingMsg.innerText = "Memproses...";
      dbStatus.innerText = "Mengirim Data...";
      
      const params = new URLSearchParams();
      params.append("id", dataScan.id);
      params.append("lat", dataScan.lat);
      params.append("lng", dataScan.lng);
      params.append("waktu_scan", dataScan.waktu_scan);

      let urlPertama = urlSiswa;
      let urlKedua = urlGuru;
      
      if (dataScan.id.length === 12 || dataScan.id.length >= 18) {
          urlPertama = urlGuru;
          urlKedua = urlSiswa;
      }

      fetch(urlPertama, { method: "POST", body: params })
      .then(res => res.text())
      .then(pesan => {
          if (pesan.toLowerCase().includes("tidak ditemukan")) {
              loadingMsg.innerText = "Mencari di DB lain...";
              return fetch(urlKedua, { method: "POST", body: params }).then(r => r.text());
          }
          return pesan;
      })
      .then(pesanFinal => {
          document.getElementById('loading-overlay').style.display = 'none';
          dbStatus.innerText = "Menunggu Scan...";
          
          if (pesanFinal.includes("Berhasil") || pesanFinal.includes("Hadir") || pesanFinal.includes("Tepat") || pesanFinal.includes("Pulang") || pesanFinal.includes("Cepat") || pesanFinal.includes("Terlambat")) {
             tampilkanPesan(document.getElementById('success-box'), "✅ " + pesanFinal);
          } else {
             tampilkanPesan(document.getElementById('error-box'), "❌ " + pesanFinal);
          }
      })
      .catch(err => {
          document.getElementById('loading-overlay').style.display = 'none';
          dbStatus.innerText = "Koneksi Terputus.";
          
          // Jika fetch gagal (mungkin sinyal lemah/putus di tengah jalan)
          simpanKeAntrean(dataScan);
          tampilkanPesan(document.getElementById('success-box'), "Koneksi gagal. Disimpan ke antrean Offline.");
      });
    }

    async function syncData() {
       // PERBAIKAN: Cegah sinkronisasi ganda yang membuat tombol macet
       if (scanQueue.length === 0 || !navigator.onLine || isSyncing) return;
       
       isSyncing = true; // Kunci proses sync
       const btn = document.getElementById('sync-btn');
       btn.innerText = "Menyinkronkan...";
       btn.disabled = true;

       let sisaAntrean = [];

       for (let i = 0; i < scanQueue.length; i++) {
           let dataScan = scanQueue[i];
           const params = new URLSearchParams();
           params.append("id", dataScan.id);
           params.append("lat", dataScan.lat);
           params.append("lng", dataScan.lng);
           params.append("waktu_scan", dataScan.waktu_scan);

           let urlTarget = (dataScan.id.length === 12 || dataScan.id.length >= 18) ? urlGuru : urlSiswa;

           try {
               let response = await fetch(urlTarget, { method: "POST", body: params });
               let pesan = await response.text();
               if (pesan.toLowerCase().includes("tidak ditemukan")) {
                   let urlDua = (urlTarget === urlGuru) ? urlSiswa : urlGuru;
                   await fetch(urlDua, { method: "POST", body: params });
               }
           } catch (error) {
               sisaAntrean.push(dataScan); // Jika gagal fetch, kembalikan ke antrean
           }
       }

       // Selesai sync, buka kembali kuncinya
       scanQueue = sisaAntrean;
       localStorage.setItem('absenQueueSmart', JSON.stringify(scanQueue));
       
       isSyncing = false; 
       updateQueueUI();
       
       btn.innerText = `🔄 Sinkronisasi Data Tertunda (${scanQueue.length})`;
       btn.disabled = false;
       
       if (scanQueue.length === 0) {
           alert("SINKRONISASI SUKSES!\nSemua data offline berhasil masuk ke database.");
       }
    }

    // PERBAIKAN FUNGSI TAMPIL PESAN
    function tampilkanPesan(element, msg) {
        element.style.display = 'block';
        element.innerHTML = msg;
        
        // Pesan hilang setelah 2 detik, dan kunci scanning dibuka
        setTimeout(() => { 
            element.style.display = 'none'; 
            isScanning = false; // Buka kunci agar bisa scan QR berikutnya
        }, 2000);
    }

    function mulaiKamera() {
      html5QrcodeScanner.start(
        { facingMode: modeKamera }, 
        { fps: 15, qrbox: 250 }, 
        onScanSuccess
      ).then(() => {
        document.getElementById('cam-status').innerText = "Kamera: Aktif (" + (modeKamera === "user" ? "Depan" : "Belakang") + ")";
      }).catch(err => {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-box').innerHTML = "Error Kamera: " + err;
      });
    }

    function gantiKamera() {
      // Pastikan hanya bisa ganti kamera jika tidak sedang scan
      if (!isScanning) {
          html5QrcodeScanner.stop().then(() => {
            modeKamera = (modeKamera === "environment") ? "user" : "environment";
            mulaiKamera();
          }).catch(err => console.log(err));
      }
    }

    window.onload = function() {
      updateQueueUI();
      getLocation();
      html5QrcodeScanner = new Html5Qrcode("reader");
      mulaiKamera();
    };
  </script>
</body>
</html>
